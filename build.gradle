plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'gg.jte.gradle' version '3.2.1'
}

group = 'ru.mentee.power'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    servletVersion = '6.1.0'
    tomcatVersion = '11.0.18'
    jteVersion = '3.2.1'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testCompileOnly 'org.junit.jupiter:junit-jupiter-params:5.9.2'
    testImplementation("org.assertj:assertj-core:3.27.7")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.+'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.+'
    compileOnly("jakarta.servlet:jakarta.servlet-api:${servletVersion}")
    implementation("org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}")
    implementation "gg.jte:jte:${jteVersion}"
    implementation "gg.jte:jte-runtime:${jteVersion}"
}

application {
    mainClass = 'ru.mentee.power.crm.Main'
}

jte {
    sourceDirectory = project.file("src/main/jte").toPath()
    contentType = "Html"
    binaryStaticContent = false
}

checkstyle {
    toolVersion = '10.12.4'
    maxErrors = 0
    maxWarnings = 999
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
    exclude 'ru.mentee.power.progress'
}

jacoco {
    toolVersion = '0.8.14'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            excludes = [
                    'ru.mentee.power.devtools.progress'
            ]
            limit {
                minimum = 0.35
            }
        }
    }
}

tasks.named("checkstyleMain") {
    group = "verification"
}

tasks.named("checkstyleTest") {
    group = "verification"
}

check {
    dependsOn jacocoTestCoverageVerification
}